name: linux native tests

# Runs tests/run_linux.sh on every push that touches the Linux backend,
# stdlib, or the tests themselves. Catches regressions in elf.k / linux_x86
# codegen and Linux-side stdlib changes before they reach main.
#
# Bootstrap uses the committed prebuilt seeds; no C compiler is required.

on:
  push:
    branches: [main]
    paths:
      - 'compiler/linux_x86/**'
      - 'compiler/linux_aarch64/**'
      - 'compiler/compile.k'
      - 'compiler/optimize.k'
      - 'stdlib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build.sh'
      - 'kcc.ks'
      - 'bootstrap/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'compiler/linux_x86/**'
      - 'compiler/linux_aarch64/**'
      - 'compiler/compile.k'
      - 'compiler/optimize.k'
      - 'stdlib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build.sh'
      - 'kcc.ks'
      - 'bootstrap/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

jobs:
  linux-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: bootstrap kcc
        # build.sh self-selects the committed prebuilt seed (gcc-free path).
        run: bash build.sh

      - name: verify kcc works
        run: KRYPTON_ROOT="$PWD" bootstrap/kcc_driver_linux_x86_64 --version || true

      - name: verify aarch64 cross emitter
        run: |
          printf 'just run { print("cross ok") }\n' > /tmp/krypton-cross.ks
          KRYPTON_ROOT="$PWD" bootstrap/kcc_driver_linux_x86_64 --aarch64 /tmp/krypton-cross.ks -o /tmp/krypton-cross
          file /tmp/krypton-cross | grep -q 'ARM aarch64'

      - name: run linux native tests
        run: bash tests/run_linux.sh

      - name: dump test work-dir on failure
        if: failure()
        run: |
          echo "===== compile logs ====="
          find tests/.work-linux -name '*.compile' -print -exec tail -20 {} \; 2>/dev/null || true
          echo "===== run logs ====="
          find tests/.work-linux -name '*.log' -print -exec tail -20 {} \; 2>/dev/null || true

  linux-aarch64-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: bootstrap native aarch64 kcc
        run: bash build.sh

      - name: verify aarch64 payload
        run: bash scripts/check_linux_aarch64.sh

      - name: run linux native tests
        run: bash build.sh test

      - name: large IR regression
        run: bash tests/run_aarch64_scaling.sh

      - name: optimizer differential
        run: bash tests/run_aarch64_optimizer.sh

      - name: dump test work-dir on failure
        if: failure()
        run: |
          echo "===== compile logs ====="
          find tests/.work-linux -name '*.compile' -print -exec tail -20 {} \; 2>/dev/null || true
          echo "===== run logs ====="
          find tests/.work-linux -name '*.log' -print -exec tail -20 {} \; 2>/dev/null || true
